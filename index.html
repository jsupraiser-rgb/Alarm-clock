<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronoAlarm - Smart Alarm & Timer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-gold: #fbbf24;
            --accent-green: #34d399;
            --accent-red: #ef4444;
            --border-color: #334155;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding-bottom: 50px;
        }
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.3rem;
            margin: 0;
            color: var(--accent-gold);
        }
        .lang-select {
            background-color: #090d16;
            color: var(--accent-gold);
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            outline: none;
        }
        .clock-display {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 24px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            text-align: center;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .time-text {
            font-size: 3rem;
            font-weight: bold;
            color: var(--accent-gold);
            letter-spacing: 2px;
        }
        .date-text {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 4px;
        }
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background-color: #1e293b;
            border: 1px solid var(--border-color);
            color: #94a3b8;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            text-align: center;
        }
        .tab-btn.active {
            background-color: var(--accent-gold);
            color: #0f172a;
            border-color: var(--accent-gold);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .box {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
        }
        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #cbd5e1;
            display: block;
            margin-bottom: 4px;
        }
        input, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #090d16;
            color: var(--text-color);
            box-sizing: border-box;
            font-size: 0.95rem;
            outline: none;
        }
        .action-btn {
            background: linear-gradient(135deg, #fbbf24, #d97706);
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            border: none;
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            font-size: 0.95rem;
            box-shadow: 0 2px 10px rgba(251, 191, 36, 0.3);
        }
        .list-card {
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }
        /* Alarm Ringing Modal / Overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.95);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="top-header">
        <h1 id="appTitle">ChronoAlarm</h1>
        <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
            <option value="en">English</option>
            <option value="hi">हिंदी</option>
            <option value="ar">العربية</option>
        </select>
    </div>

    <!-- Live Clock Banner -->
    <div class="clock-display">
        <div class="time-text" id="liveClock">00:00:00</div>
        <div class="date-text" id="liveDate">Loading date...</div>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('alarms', this)" id="tabAlarmBtn">Alarms</button>
        <button class="tab-btn" onclick="switchTab('stopwatch', this)" id="tabStopwatchBtn">Stopwatch</button>
    </div>

    <!-- TAB 1: ALARMS -->
    <div id="tab-alarms" class="tab-content active">
        <div class="box">
            <label id="lblSetAlarm">Set New Alarm</label>
            <input type="time" id="alarmTimeInput" required>
            <label id="lblAlarmLabel">Alarm Label</label>
            <input type="text" id="alarmLabelInput" placeholder="e.g. Morning Workout">
            <button class="action-btn" onclick="addAlarm()" id="addAlarmBtn">Add Alarm</button>
        </div>
        <div id="alarmListContainer"></div>
    </div>

    <!-- TAB 2: STOPWATCH -->
    <div id="tab-stopwatch" class="tab-content">
        <div class="box" style="text-align: center;">
            <div style="font-size: 2.5rem; font-weight: bold; color: var(--accent-gold); margin: 15px 0;" id="stopwatchDisplay">00:00:00</div>
            <div style="display: flex; gap: 8px;">
                <button class="action-btn" onclick="startStopwatch()" id="swStartBtn" style="background:#34d399; color:#0f172a;">Start</button>
                <button class="action-btn" onclick="pauseStopwatch()" id="swPauseBtn" style="background:#fbbf24; color:#0f172a;">Pause</button>
                <button class="action-btn" onclick="resetStopwatch()" id="swResetBtn" style="background:#ef4444; color:#fff;">Reset</button>
            </div>
        </div>
    </div>
</div>

<!-- MATH PUZZLE WAKE-UP MODAL -->
<div id="alarmModal" class="modal">
    <h2 style="color: var(--accent-red); font-size: 2rem; margin-bottom: 10px;" id="modalAlarmAlert">🚨 ALARM RINGING! 🚨</h2>
    <p style="color: #94a3b8; margin-bottom: 20px;" id="modalPuzzleInstruction">Solve this math puzzle to dismiss the alarm:</p>
    <div style="font-size: 1.8rem; font-weight: bold; color: var(--accent-gold); margin-bottom: 15px;" id="mathProblem">5 + 3 = ?</div>
    <input type="number" id="mathAnswerInput" placeholder="Enter answer" style="max-width: 250px; text-align: center; font-size: 1.2rem;">
    <button class="action-btn" style="max-width: 250px; background-color: var(--accent-green); color: #0f172a;" onclick="verifyMathAnswer()" id="dismissBtn">Dismiss Alarm</button>
</div>

<script>
    let currentLang = localStorage.getItem('alarm_lang') || 'en';
    document.getElementById('langSelect').value = currentLang;

    let alarms = JSON.parse(localStorage.getItem('alarm_list')) || [
        { time: '07:00', label: 'Morning Workout', active: true },
        { time: '08:30', label: 'College Lecture', active: true }
    ];

    let currentCorrectAnswer = 0;
    let ringingAlarmIndex = null;

    const translations = {
        en: {
            title: "ChronoAlarm",
            tabAlarm: "Alarms",
            tabStopwatch: "Stopwatch",
            lblSetAlarm: "Set New Alarm",
            lblAlarmLabel: "Alarm Label",
            addAlarmBtn: "Add Alarm",
            modalAlert: "🚨 ALARM RINGING! 🚨",
            puzzleInstruction: "Solve this math puzzle to dismiss the alarm:",
            dismissBtn: "Dismiss Alarm"
        },
        hi: {
            title: "क्रोनो अलार्म",
            tabAlarm: "अलार्म",
            tabStopwatch: "स्टॉपवॉच",
            lblSetAlarm: "नया अलार्म सेट करें",
            lblAlarmLabel: "अलार्म का नाम",
            addAlarmBtn: "अलार्म जोड़ें",
            modalAlert: "🚨 अलार्म बज रहा है! 🚨",
            puzzleInstruction: "अलार्म बंद करने के लिए इस गणित पहेली को हल करें:",
            dismissBtn: "अलार्म बंद करें"
        },
        ar: {
            title: "منبه كرونو",
            tabAlarm: "المنبهات",
            tabStopwatch: "ساعة الإيقاف",
            lblSetAlarm: "ضبط منبه جديد",
            lblAlarmLabel: "تسمية المنبه",
            addAlarmBtn: "إضافة منبه",
            modalAlert: "🚨 المنبه يرن! 🚨",
            puzzleInstruction: "حل هذه المسألة الرياضية لإيقاف المنبه:",
            dismissBtn: "إيقاف المنبه"
        }
    };

    function changeLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('alarm_lang', lang);
        applyTranslations();
    }

    function applyTranslations() {
        let t = translations[currentLang] || translations['en'];
        document.getElementById('appTitle').textContent = t.title;
        document.getElementById('tabAlarmBtn').textContent = t.tabAlarm;
        document.getElementById('tabStopwatchBtn').textContent = t.tabStopwatch;
        document.getElementById('lblSetAlarm').textContent = t.lblSetAlarm;
        document.getElementById('lblAlarmLabel').textContent = t.lblAlarmLabel;
        document.getElementById('addAlarmBtn').textContent = t.addAlarmBtn;
        document.getElementById('modalAlarmAlert').textContent = t.modalAlert;
        document.getElementById('modalPuzzleInstruction').textContent = t.puzzleInstruction;
        document.getElementById('dismissBtn').textContent = t.dismissBtn;
    }

    function switchTab(tabName, btnEl) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById('tab-' + tabName).classList.add('active');
        btnEl.classList.add('active');
    }

    // Live Clock Engine
    setInterval(() => {
        let now = new Date();
        let hours = String(now.getHours()).padStart(2, '0');
        let minutes = String(now.getMinutes()).padStart(2, '0');
        let seconds = String(now.getSeconds()).padStart(2, '0');
        
        document.getElementById('liveClock').textContent = `${hours}:${minutes}:${seconds}`;
        document.getElementById('liveDate').textContent = now.toDateString();

        // Check if any active alarm matches current time (HH:MM)
        let currentTimeStr = `${hours}:${minutes}`;
        alarms.forEach((alarm, index) => {
            if (alarm.active && alarm.time === currentTimeStr && ringingAlarmIndex === null) {
                triggerAlarm(index);
            }
        });
    }, 1000);

    function triggerAlarm(index) {
        ringingAlarmIndex = index;
        let num1 = Math.floor(Math.random() * 10) + 1;
        let num2 = Math.floor(Math.random() * 10) + 1;
        currentCorrectAnswer = num1 + num2;
        document.getElementById('mathProblem').textContent = `${num1} + ${num2} = ?`;
        document.getElementById('alarmModal').style.display = 'flex';
    }

    function verifyMathAnswer() {
        let userAns = parseInt(document.getElementById('mathAnswerInput').value);
        if (userAns === currentCorrectAnswer) {
            document.getElementById('alarmModal').style.display = 'none';
            document.getElementById('mathAnswerInput').value = '';
            if (ringingAlarmIndex !== null) {
                alarms[ringingAlarmIndex].active = false; // Turn off alarm after success
                ringingAlarmIndex = null;
                updateAlarmUI();
            }
        } else {
            alert(currentLang === 'hi' ? 'गलत उत्तर! पुनः प्रयास करें।' : (currentLang === 'ar' ? 'إجابة خاطئة! حاول مرة أخرى.' : 'Incorrect answer! Try again.'));
        }
    }

    function addAlarm() {
        let time = document.getElementById('alarmTimeInput').value;
        let label = document.getElementById('alarmLabelInput').value.trim() || 'Alarm';
        if (!time) return;

        alarms.push({ time, label, active: true });
        document.getElementById('alarmTimeInput').value = '';
        document.getElementById('alarmLabelInput').value = '';
        updateAlarmUI();
    }

    function toggleAlarm(index) {
        alarms[index].active = !alarms[index].active;
        updateAlarmUI();
    }

    function deleteAlarm(index) {
        alarms.splice(index, 1);
        updateAlarmUI();
    }

    function updateAlarmUI() {
        let html = '';
        alarms.forEach((alarm, idx) => {
            html += `
                <div class="list-card">
                    <div>
                        <strong style="font-size: 1.2rem; color: var(--accent-gold);">${alarm.time}</strong>
                        <span style="color: #94a3b8; font-size: 0.85rem;">${alarm.label}</span>
                    </div>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <input type="checkbox" ${alarm.active ? 'checked' : ''} onchange="toggleAlarm(${idx})" style="width: 20px; height: 20px; cursor: pointer; margin: 0;">
                        <button onclick="deleteAlarm(${idx})" style="background: #ef4444; color: #fff; border: none; padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem;">Del</button>
                    </div>
                </div>
            `;
        });
        document.getElementById('alarmListContainer').innerHTML = html || '<p style="text-align:center; color:#94a3b8;">No alarms set.</p>';
        localStorage.setItem('alarm_list', JSON.stringify(alarms));
    }

    // Stopwatch logic
    let swSeconds = 0, swInterval = null;
    function startStopwatch() {
        if (!swInterval) {
            swInterval = setInterval(() => {
                swSeconds++;
                let hrs = String(Math.floor(swSeconds / 3600)).padStart(2, '0');
                let mins = String(Math.floor((swSeconds % 3600) / 60)).padStart(2, '0');
                let secs = String(swSeconds % 60).padStart(2, '0');
                document.getElementById('stopwatchDisplay').textContent = `${hrs}:${mins}:${secs}`;
            }, 1000);
        }
    }
    function pauseStopwatch() {
        clearInterval(swInterval);
        swInterval = null;
    }
    function resetStopwatch() {
        pauseStopwatch();
        swSeconds = 0;
        document.getElementById('stopwatchDisplay').textContent = "00:00:00";
    }

    updateAlarmUI();
    applyTranslations();
</script>

</body>
</html>
